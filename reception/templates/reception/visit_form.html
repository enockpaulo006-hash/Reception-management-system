{% extends "reception/base.html" %}

{% block title %}New patient - {{ CLINIC_NAME }}{% endblock %}

{% block content %}
  <div class="panel" style="max-width:560px">
    <div class="panel-head"><h1 style="margin:0">New patient</h1></div>
    <div class="panel-body" style="padding:18px">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div style="margin-bottom:15px">
            <label for="{{ field.id_for_label }}" style="display:block;margin-bottom:5px;font-weight:600">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
            {{ field }}
            {% for error in field.errors %}<div style="color:#8d2525;margin-top:4px">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button type="submit">Save and take payment</button>
      </form>
    </div>
  </div>
{% endblock %}
